# Refreshes data.json every 30 minutes and commits it here. The dashboard at
# stateofblocks.com/dashboards/kntq-burn/ reads it from this repo's public raw URL, so new data
# never needs a site deploy. This repo is public, so these runs use no paid Actions minutes.
name: Refresh KNTQ burn data
on:
  # Scheduled runs never fired for this repo, so the 30-minute refresh runs from cron on the State of Blocks VPS
  # (/opt/kntq-burn-data/run.sh, at :07 and :37) since 2026-11-13. This workflow is kept for running it by hand.
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Refresh
        run: node refresh.mjs
      - name: Commit data.json if it changed
        run: |
          git config user.name "sob-bot"; git config user.email "info@stateofblocks.com"
          git add data.json
          git diff --cached --quiet || (git commit -q -m "Refresh data" && git pull -q --rebase && git push -q)
